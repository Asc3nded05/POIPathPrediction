<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/poi-collectible.js"></script>
    <script src="js/poi-spawner.js"></script>
    <script src="js/data-logger.js"></script>
    <script src="js/trial-manager.js"></script>
  </head>

  <body>
    <a-scene xr-mode-ui="enabled: true">

    <!-- User rig -->
    <a-entity id="rig">
        <a-camera id="camera">
            <a-cursor raycaster="objects: .clickable"></a-cursor>
        </a-camera>
    </a-entity>

    <!-- Ground -->
    <a-plane position= "0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

    <!-- Walls -->
    <a-plane position= "0 3.5 -5" rotation="0 0 0" width="10" height="7" color="steelblue"></a-plane>
    <a-plane position= "-5 3.5 0" rotation="0 90 0" width="10" height="7" color="steelblue"></a-plane>
    <a-plane position= "0 3.5 5" rotation="0 180 0" width="10" height="7" color="steelblue"></a-plane>
    <a-plane position= "5 3.5 0" rotation="0 270 0" width="10" height="7" color="steelblue"></a-plane>

    <!-- Roof -->
     <a-plane position= "0 7 0" rotation="90 0 0" width="10" height="10" color="slategray"></a-plane>

    <!-- POIs will be spawned here -->
    <a-entity id="poi-container"></a-entity>

    <a-entity data-logger trial-manager></a-entity>

    <!-- UI button to export JSON -->
    <a-entity id="exportButton"
            position="-1 1.6 -1"
            text="value: Export Data; color: black"
            geometry="primitive: plane; width: 0.8; height: 0.3"
            material="color: white"
            class="clickable">
    </a-entity>

    <a-entity id="startTrial"
            position="0 1.6 -1"
            text="value: Start Trial; color: black"
            geometry="primitive: plane; width: 0.8; height: 0.3"
            material="color: white"
            class="clickable">
    </a-entity>

    </a-scene>
  </body>
</html>
